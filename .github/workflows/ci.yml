name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: relayhub
          POSTGRES_USER: relayhub
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U relayhub -d relayhub"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      RELAYHUB_MODE: demo
      RELAYHUB_BASE_URL: http://localhost:3000
      DATABASE_URL: postgresql://relayhub:ci-ephemeral-only@127.0.0.1:55432/relayhub
      REDIS_URL: redis://127.0.0.1:56379
      ACTIVE_KEY_ID: v1
      DEMO_RECEIVER_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.16.0"
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --prod --audit-level moderate
      - name: Generate temporary keys
        run: |
          echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ENCRYPTION_KEYS=v1:$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "DEMO_RECEIVER_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: pnpm migrate
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Test running application
        run: |
          pnpm start > web.log 2>&1 &
          pnpm receiver > receiver.log 2>&1 &
          pnpm worker > worker.log 2>&1 &
          curl --fail --retry 30 --retry-all-errors --retry-delay 1 http://localhost:3000/api/health/ready
          curl --fail --retry 30 --retry-all-errors --retry-delay 1 http://127.0.0.1:3001/health
          curl --fail --retry 30 --retry-all-errors --retry-delay 1 http://127.0.0.1:3002/ready
          pnpm test:integration
          pnpm test:e2e
