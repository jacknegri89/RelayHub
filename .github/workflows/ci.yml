name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: relayhub
          POSTGRES_USER: relayhub
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U relayhub -d relayhub"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.33.0
        ports: ["127.0.0.1:8025:8025"]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      RELAYHUB_MODE: demo
      RELAYHUB_BASE_URL: http://localhost:3000
      DATABASE_URL: postgresql://relayhub:ci-ephemeral-only@127.0.0.1:55432/relayhub
      REDIS_URL: redis://127.0.0.1:56379
      ACTIVE_KEY_ID: v1
      DEMO_RECEIVER_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.16.0"
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --prod --audit-level moderate
      - name: Generate temporary keys
        run: |
          echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ENCRYPTION_KEYS=v1:$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "DEMO_RECEIVER_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: pnpm migrate
      - name: Rehearse encrypted PostgreSQL backup and isolated restore
        env:
          PGPORT: "55432"
          PGUSER: relayhub
          PGPASSWORD: ci-ephemeral-only
          RELAYHUB_DRILL_REDIS_PORT: "56379"
        run: |
          if [[ ! -x /usr/lib/postgresql/17/bin/pg_dump ]]; then
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo apt-get install -y postgresql-client-17
          fi
          PATH="/usr/lib/postgresql/17/bin:$PATH" node scripts/restore-drill.mjs
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Test running application
        run: |
          pnpm start > web.log 2>&1 &
          pnpm receiver > receiver.log 2>&1 &
          pnpm worker > worker.log 2>&1 &
          curl --fail --retry 30 --retry-all-errors --retry-delay 1 http://localhost:3000/api/health/ready
          curl --fail --retry 30 --retry-all-errors --retry-delay 1 http://127.0.0.1:3001/health
          curl --fail --retry 30 --retry-all-errors --retry-delay 1 http://127.0.0.1:3002/ready
          RELAYHUB_TEST_MAILPIT_URL=http://127.0.0.1:8025 pnpm test:integration
          pnpm test:e2e
      - name: Verify account mail in an isolated local mailbox
        env:
          RELAYHUB_BASE_URL: http://localhost:3081
          RELAYHUB_ACCOUNT_EMAIL: "1"
          RELAYHUB_MAILPIT_URL: http://127.0.0.1:8025
          RELAYHUB_TEST_MAILPIT_URL: http://127.0.0.1:8025
        run: |
          node apps/web/node_modules/next/dist/bin/next start apps/web --hostname 127.0.0.1 --port 3081 > account-web.log 2>&1 &
          account_web_pid=$!
          trap 'kill "$account_web_pid" 2>/dev/null || true' EXIT
          curl --fail --retry 20 --retry-all-errors --retry-delay 1 http://localhost:3081/api/health/ready
          pnpm exec playwright test -c tests/account-browser/playwright.config.ts
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: relayhub-ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.16.0"
      - name: Start the complete stack with fresh volumes
        run: |
          node scripts/setup.mjs
          docker compose up --build -d --wait --wait-timeout 180
      - name: Accept duplicate submissions while the worker is stopped
        run: |
          export DEMO_USER_PASSWORD="$(openssl rand -hex 24)"
          docker compose exec -T -e DEMO_USER_PASSWORD web pnpm seed
          docker compose stop worker
          docker compose exec -T web pnpm demo duplicate
          docker compose start worker
      - name: Verify one committed event, one delivery and one acknowledgement
        run: |
          counts() {
            docker compose exec -T postgres psql -U relayhub -d relayhub -At -v ON_ERROR_STOP=1 <<'SQL'
          SELECT count(DISTINCT e.id), count(DISTINCT d.id), count(a.id),
                 count(a.id) FILTER (WHERE d.status = 'delivered' AND a."httpStatus" = 200)
          FROM "WebhookEvent" e
          LEFT JOIN "Delivery" d ON d."eventId" = e.id
          LEFT JOIN "DeliveryAttempt" a ON a."deliveryId" = d.id
          WHERE e."eventType" = 'demo.success';
          SQL
          }
          for attempt in {1..30}; do
            observed="$(counts)"
            if [[ "$observed" == '1|1|1|1' ]]; then exit 0; fi
            sleep 2
          done
          echo "Unexpected event, delivery, attempt and HTTP 200 counts: $observed"
          exit 1
      - if: always()
        run: docker compose down --volumes
