x-app: &app
  image: relayhub-local
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql://relayhub:${POSTGRES_PASSWORD:?Run pnpm setup before Compose}@postgres:5432/relayhub
    REDIS_URL: redis://redis:6379
    DEMO_RECEIVER_URL: http://mock-receiver:3001
  init: true
  restart: unless-stopped

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: relayhub
      POSTGRES_USER: relayhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm setup before Compose}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relayhub -d relayhub"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    restart: "no"
    command: ["pnpm", "migrate"]
    depends_on:
      postgres: { condition: service_healthy }
  web:
    <<: *app
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
  worker:
    <<: *app
    command: ["node", "scripts/run.mjs", "worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
  mock-receiver:
    <<: *app
    command: ["node", "scripts/run.mjs", "receiver"]
    environment:
      RECEIVER_BIND: 0.0.0.0
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  postgres:
  redis:
